<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>冷库调度台 · 白板拼箱</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">❄</span>
    <div>
      <h1>冷库调度台</h1>
      <p>白板拼箱 · 温区匹配 · 急货优先 · 已入柜不挪</p>
    </div>
  </div>
  <div class="clock" id="clock">--</div>
  <div class="top-actions">
    <button class="btn primary" id="btn-dispatch" type="button">手动调度一轮</button>
    <button class="btn ghost" id="btn-reset" type="button">恢复预置数据</button>
  </div>
</header>

<nav class="zone-tabs" id="zone-tabs" aria-label="按温区筛选"></nav>

<main>
  <section class="panel">
    <div class="panel-head">
      <h2>温区柜占用</h2>
      <span class="hint">入柜须同温区且容积充足；截港不足 2 小时优先挑柜</span>
    </div>
    <div class="cabinet-grid" id="cabinet-grid"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>货物队列</h2>
      <span class="hint" id="queue-summary"></span>
    </div>
    <div class="table-wrap">
      <table class="cargo-table">
        <thead>
          <tr>
            <th>货号</th>
            <th>温区</th>
            <th>体积 (m³)</th>
            <th>截港时刻</th>
            <th>冷处理证明</th>
            <th>状态 / 柜位</th>
            <th class="ta-right">操作</th>
          </tr>
        </thead>
        <tbody id="cargo-tbody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel log-panel">
    <div class="panel-head">
      <h2>调度记录</h2>
      <span class="hint">仅本次会话演示展示</span>
    </div>
    <ul class="log-list" id="log-list"></ul>
  </section>
</main>

<dialog id="edit-dialog">
  <form method="dialog" id="edit-form">
    <h3>改温区 / 体积</h3>
    <p class="dialog-tip">货号 <b id="edit-cargo-id"></b>：修改后将释放原柜位并重新排队。</p>
    <label class="field">
      <span>温区</span>
      <select id="edit-zone"></select>
    </label>
    <label class="field">
      <span>体积 (m³)</span>
      <input type="number" id="edit-volume" min="0.1" step="0.1" required />
    </label>
    <div class="dialog-actions">
      <button type="button" class="btn ghost" id="edit-cancel">取消</button>
      <button type="button" class="btn primary" id="edit-save">保存并重新排队</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script src="js/rules.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
